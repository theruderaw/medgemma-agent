<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedGemma Agent</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --user: #1d4ed8;
    --assistant: #334155;
    --danger: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok);
  }
  .dot.down { background: var(--danger); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--assistant); }
  .msg.error { align-self: center; background: var(--danger); max-width: 90%; font-size: 13px; }
  .msg .role {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .msg.user .role { color: #bfdbfe; }
  .typing { color: var(--muted); font-style: italic; align-self: flex-start; }
  footer {
    padding: 12px 20px;
    background: var(--panel);
    border-top: 1px solid var(--panel-2);
    display: flex;
    gap: 10px;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px;
    font: inherit;
    max-height: 120px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--panel-2);
    font-weight: 400;
  }
  button.secondary:hover { color: var(--text); }
  .session-row { display: flex; align-items: center; gap: 12px; }
  .session-id {
    font-family: monospace;
    font-size: 12px;
    color: var(--muted);
    background: var(--panel-2);
    padding: 3px 8px;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>MedGemma Agent</h1>
      <div class="sub">Qwen3 &middot; MedGemma &middot; triage classifier</div>
    </div>
    <div class="session-row">
      <span id="sessionBadge" class="session-id" hidden></span>
      <button id="resetBtn" class="secondary" type="button" hidden>New chat</button>
      <span id="status" class="status"><span class="dot" id="statusDot"></span><span id="statusText">checking…</span></span>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <textarea id="input" rows="1" placeholder="Describe your symptoms or ask a health question…" aria-label="Message"></textarea>
    <button id="sendBtn" type="button">Send</button>
  </footer>

<script>
(function () {
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');
  const sessionBadge = document.getElementById('sessionBadge');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  let sessionId = null;

  async function checkHealth() {
    try {
      const res = await fetch('/health');
      const ok = res.ok;
      statusDot.classList.toggle('down', !ok);
      statusText.textContent = ok ? 'online' : 'error';
    } catch {
      statusDot.classList.add('down');
      statusText.textContent = 'offline';
    }
  }

  function addMessage(role, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    const label = document.createElement('span');
    label.className = 'role';
    label.textContent = role === 'user' ? 'You' : (role === 'error' ? 'Error' : 'Assistant');
    el.appendChild(label);
    el.appendChild(document.createTextNode(text));
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    sendBtn.textContent = busy ? '…' : 'Send';
    input.disabled = busy;
  }

  function setSession(id) {
    sessionId = id || null;
    if (sessionId) {
      sessionBadge.textContent = 'session ' + sessionId.slice(0, 8);
      sessionBadge.hidden = false;
      resetBtn.hidden = false;
    } else {
      sessionBadge.hidden = true;
      resetBtn.hidden = true;
    }
  }

  async function send() {
    const message = input.value.trim();
    if (!message || sendBtn.disabled) return;
    input.value = '';
    input.style.height = 'auto';
    addMessage('user', message);

    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.textContent = 'Assistant is thinking…';
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    setBusy(true);
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: sessionId }),
      });
      const data = await res.json().catch(() => ({}));
      typing.remove();
      if (!res.ok) {
        addMessage('error', data.detail || ('Request failed (' + res.status + ')'));
        if (res.status === 410) setSession(null);
        return;
      }
      setSession(data.session_id);
      addMessage('assistant', data.response);
    } catch (err) {
      typing.remove();
      addMessage('error', 'Could not reach the server: ' + err.message);
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  async function reset() {
    if (!sessionId) return;
    try {
      await fetch('/sessions/' + encodeURIComponent(sessionId), { method: 'DELETE' });
    } finally {
      setSession(null);
    }
  }

  sendBtn.addEventListener('click', send);
  resetBtn.addEventListener('click', reset);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  checkHealth();
  input.focus();
})();
</script>
</body>
</html>
