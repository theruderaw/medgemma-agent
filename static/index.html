<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedGemma Agent</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --user: #1d4ed8;
    --assistant: #334155;
    --danger: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok);
  }
  .dot.down { background: var(--danger); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .layout {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .events-panel {
    width: 340px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--panel-2);
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .events-panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--panel-2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .events-empty {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }
  .evt {
    background: var(--panel-2);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border: 1px solid transparent;
    border-left-width: 3px;
  }
  .evt.safety { border-left-color: var(--danger); }
  .evt.triage { border-left-color: #a78bfa; }
  .evt.router { border-left-color: var(--accent); }
  .evt.specialist { border-left-color: var(--ok); }
  .evt.chat { border-left-color: var(--muted); }
  .evt-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .evt-module {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    color: var(--accent);
  }
  .evt-type {
    font-family: monospace;
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .evt-body {
    color: var(--text);
    line-height: 1.4;
    word-wrap: break-word;
    max-height: 96px;
    overflow-y: auto;
  }
  .evt-body pre {
    margin: 0;
    font-family: inherit;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .evt-body .kv { display: flex; gap: 6px; }
  .evt-body .kv b { color: var(--muted); font-weight: 600; }
  .evt-raw {
    font-family: monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    border-radius: 6px;
    padding: 6px;
    max-height: 120px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .evt-time {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--assistant); }
  .msg.error { align-self: center; background: var(--danger); max-width: 90%; font-size: 13px; }
  .urgency {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text);
    background: var(--bg);
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 6px;
  }
  .urgency .u-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .urgency.emergency { border: 1px solid var(--danger); }
  .urgency.emergency .u-dot { background: var(--danger); }
  .urgency.medical { border: 1px solid #f59e0b; }
  .urgency.medical .u-dot { background: #f59e0b; }
  .urgency.general { border: 1px solid var(--ok); }
  .urgency.general .u-dot { background: var(--ok); }
  .msg .role {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .msg.user .role { color: #bfdbfe; }
  .typing { color: var(--muted); font-style: italic; align-self: flex-start; }
  footer {
    padding: 12px 20px;
    background: var(--panel);
    border-top: 1px solid var(--panel-2);
    display: flex;
    gap: 10px;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px;
    font: inherit;
    max-height: 120px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--panel-2);
    font-weight: 400;
  }
  button.secondary:hover { color: var(--text); }
  .session-row { display: flex; align-items: center; gap: 12px; }
  .session-id {
    font-family: monospace;
    font-size: 12px;
    color: var(--muted);
    background: var(--panel-2);
    padding: 3px 8px;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>MedGemma Agent</h1>
      <div class="sub">Qwen3 router &middot; MedGemma specialist &middot; triage classifier</div>
    </div>
    <div class="session-row">
      <span id="sessionBadge" class="session-id" hidden></span>
      <button id="resetBtn" class="secondary" type="button" hidden>New chat</button>
      <span id="status" class="status"><span class="dot" id="statusDot"></span><span id="statusText">checking…</span></span>
    </div>
  </header>

  <div class="layout">
    <main id="chat" aria-live="polite"></main>
    <aside class="events-panel" id="eventsPanel" aria-label="Pipeline events">
      <h2>Pipeline events</h2>
      <div id="eventsList"></div>
    </aside>
  </div>

  <footer>
    <textarea id="input" rows="1" placeholder="Describe your symptoms or ask a health question…" aria-label="Message"></textarea>
    <button id="sendBtn" type="button">Send</button>
  </footer>

<script>
(function () {
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');
  const sessionBadge = document.getElementById('sessionBadge');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const eventsList = document.getElementById('eventsList');

  let sessionId = null;

  function esc(s) {
    const div = document.createElement('div');
    div.textContent = s == null ? '' : String(s);
    return div.innerHTML;
  }

  function renderEvent(ev) {
    const el = document.createElement('div');
    el.className = 'evt ' + ev.module;

    const top = document.createElement('div');
    top.className = 'evt-top';
    const module = document.createElement('span');
    module.className = 'evt-module';
    module.textContent = ev.module;
    const type = document.createElement('span');
    type.className = 'evt-type';
    type.textContent = ev.event_type;
    top.appendChild(module);
    top.appendChild(type);

    const body = document.createElement('div');
    body.className = 'evt-body';
    const p = ev.payload || {};
    switch (ev.event_type) {
      case 'safety_override':
        body.innerHTML = '<div class="kv"><b>category</b><span>' + esc(p.category) + '</span></div>';
        break;
      case 'triage_result':
        body.innerHTML = '<div class="kv"><b>urgency</b><span>' + esc(p.urgency) + '</span></div>';
        break;
      case 'routing_decision':
        body.innerHTML = '<div class="kv"><b>category</b><span>' + esc(p.category) + '</span></div>' +
          (p.reason ? '<div class="kv"><b>reason</b><span>' + esc(p.reason) + '</span></div>' : '');
        break;
      case 'specialist_output':
        body.innerHTML = '<div class="kv"><b>model</b><span>' + esc(p.model) + '</span></div>' +
          (p.reason ? '<div class="kv"><b>reason</b><span>' + esc(p.reason) + '</span></div>' : '') +
          '<div class="evt-raw">' + esc(p.note || '') + '</div>';
        break;
      case 'turn_completed':
        body.innerHTML = '<div class="kv"><b>model</b><span>' + esc(p.model) + '</span></div>' +
          '<div class="evt-raw">' + esc(p.response || '') + '</div>';
        break;
      default:
        body.innerHTML = '<div class="evt-raw">' + esc(JSON.stringify(p)) + '</div>';
    }

    const time = document.createElement('span');
    time.className = 'evt-time';
    time.textContent = new Date().toLocaleTimeString();

    el.appendChild(top);
    el.appendChild(body);
    el.appendChild(time);
    return el;
  }

  function addEvents(events) {
    if (!events || !events.length) return;
    for (const ev of events) {
      eventsList.appendChild(renderEvent(ev));
    }
    eventsList.scrollTop = eventsList.scrollHeight;
  }

  function clearEvents() {
    eventsList.innerHTML = '';
    renderedEvents.clear();
    const empty = document.createElement('div');
    empty.className = 'events-empty';
    empty.textContent = 'No pipeline events yet. Send a message to see routing, triage, and specialist activity.';
    eventsList.appendChild(empty);
  }

  async function checkHealth() {
    try {
      const res = await fetch('/health');
      const ok = res.ok;
      statusDot.classList.toggle('down', !ok);
      statusText.textContent = ok ? 'online' : 'error';
    } catch {
      statusDot.classList.add('down');
      statusText.textContent = 'offline';
    }
  }

  function addMessage(role, text, urgency) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    const label = document.createElement('span');
    label.className = 'role';
    label.textContent = role === 'user' ? 'You' : (role === 'error' ? 'Error' : 'Assistant');
    el.appendChild(label);
    if (role === 'assistant' && urgency) {
      const badge = document.createElement('span');
      badge.className = 'urgency ' + urgency;
      const dot = document.createElement('span');
      dot.className = 'u-dot';
      badge.appendChild(dot);
      badge.appendChild(document.createTextNode(urgency));
      el.appendChild(badge);
    }
    el.appendChild(document.createTextNode(text));
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    sendBtn.textContent = busy ? '…' : 'Send';
    input.disabled = busy;
  }

  function setSession(id) {
    sessionId = id || null;
    if (sessionId) {
      sessionBadge.textContent = 'session ' + sessionId.slice(0, 8);
      sessionBadge.hidden = false;
      resetBtn.hidden = false;
    } else {
      sessionBadge.hidden = true;
      resetBtn.hidden = true;
    }
  }

  const renderedEvents = new Set();

  function markRendered(ev) {
    const key = JSON.stringify(ev);
    if (renderedEvents.has(key)) return false;
    renderedEvents.add(key);
    return true;
  }

  function streamJob(jobId, typing) {
    const es = new EventSource('/jobs/' + encodeURIComponent(jobId) + '/events');
    let networkErrors = 0;

    es.addEventListener('pipeline', (e) => {
      let ev;
      try { ev = JSON.parse(e.data); } catch { return; }
      if (markRendered(ev)) eventsList.appendChild(renderEvent(ev));
      eventsList.scrollTop = eventsList.scrollHeight;
    });

    es.addEventListener('result', (e) => {
      let r;
      try { r = JSON.parse(e.data); } catch { r = {}; }
      typing.remove();
      es.close();
      setBusy(false);
      setSession(r.session_id);
      addMessage('assistant', r.response, r.urgency);
      for (const ev of r.events || []) {
        if (markRendered(ev)) eventsList.appendChild(renderEvent(ev));
      }
      eventsList.scrollTop = eventsList.scrollHeight;
      input.focus();
    });

    es.addEventListener('error', (e) => {
      if (e.data) {
        let err;
        try { err = JSON.parse(e.data).error || 'Job failed'; } catch { err = 'Job failed'; }
        typing.remove();
        es.close();
        setBusy(false);
        addMessage('error', err);
        input.focus();
      } else if (++networkErrors >= 5) {
        typing.remove();
        es.close();
        setBusy(false);
        addMessage('error', 'Lost connection to the job stream.');
        input.focus();
      }
    });
  }

  async function send() {
    const message = input.value.trim();
    if (!message || sendBtn.disabled) return;
    input.value = '';
    input.style.height = 'auto';
    addMessage('user', message);

    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.textContent = 'Assistant is thinking…';
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    setBusy(true);
    let streamed = false;
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: sessionId }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        typing.remove();
        addMessage('error', data.detail || ('Request failed (' + res.status + ')'));
        if (res.status === 410) setSession(null);
        return;
      }
      setSession(data.session_id);
      if (data.status === 'queued') {
        streamed = true;
        streamJob(data.job_id, typing);
        return;
      }
      typing.remove();
      addMessage('assistant', data.response, data.urgency);
      addEvents(data.events);
    } catch (err) {
      typing.remove();
      addMessage('error', 'Could not reach the server: ' + err.message);
    } finally {
      if (!streamed) {
        setBusy(false);
        input.focus();
      }
    }
  }

  async function reset() {
    if (!sessionId) return;
    try {
      await fetch('/sessions/' + encodeURIComponent(sessionId), { method: 'DELETE' });
    } finally {
      setSession(null);
      clearEvents();
    }
  }

  sendBtn.addEventListener('click', send);
  resetBtn.addEventListener('click', reset);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  checkHealth();
  input.focus();
  clearEvents();
})();
</script>
</body>
</html>
